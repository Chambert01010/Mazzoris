{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Staff - Mazzoris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'backoffice.css' %}?v=20260331b">
</head>
<body class="backoffice-page auth-page">
    <header class="dashboard-topbar auth-topbar">
        <div class="dashboard-header">
            <div class="dashboard-brand">
                <div class="dashboard-brand__mark">
                    <img src="{% static 'logo-mazzoris.png' %}" alt="Logo Mazzoris">
                </div>
                <div>
                    <p class="dashboard-kicker">Acceso interno</p>
                    <h1>Mazzoris Staff</h1>
                </div>
            </div>
            <a class="secondary-btn secondary-btn--link" href="{% url 'home' %}">Volver al sitio</a>
        </div>
    </header>

    <div class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <p class="auth-kicker">Panel de autenticación</p>
                <h2 style="color:#1e1a14; font-family: Manrope ; text-align: center;">Ingresa para acceder a las herramientas de Mazzoris 🦁</h2>
            </div>

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message {{ message.tags|default:'info' }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="auth-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="primary-btn">Entrar</button>
            </form>
        </section>
    </div>
</body>
</html>
